<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><style>
body{font:14px system-ui;width:330px;padding:14px;line-height:1.5}
button{margin-top:10px;padding:9px;width:100%;cursor:pointer}
input{width:100%} #status{white-space:pre-wrap} .hint{color:#555}
</style></head><body>
<strong>나의 마이솔 · 글쓰기 도우미</strong>
<p>승인된 글 파일을 선택하세요. 제목과 본문을 각각 복사할 수 있습니다. 저장·발행은 하지 않습니다.</p>
<input id="file" type="file" accept=".json,application/json">
<button id="copyTitle">① 제목 복사</button>
<button id="copyBody">② 본문 복사</button>
<p class="hint">복사한 다음 네이버 글쓰기 화면의 해당 칸을 클릭하고 ⌘V로 붙여넣으세요. 본문 줄바꿈은 유지됩니다.</p>
<p id="status" role="status"></p>
<script src="popup.js"></script></body></html>
