<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><style>
body{font:14px system-ui;width:320px;padding:16px;line-height:1.5}
#status{white-space:pre-wrap;margin:12px 0 0}
h1{font-size:15px;margin:0}
small{display:block;color:#666;margin-top:8px}
</style></head>
<body>
<h1>나의 마이솔 · 자동 발행</h1>
<p id="status" role="status" aria-live="polite">승인된 새 글을 확인하고 자동 발행을 준비하는 중...</p>
<small>네이버 글쓰기 화면에서 확장 프로그램을 열면 승인된 새 글을 검증 후 자동 발행합니다. 이미 발행된 글은 차단합니다.</small>
<button id="reviewFinalPublish" type="button" style="margin-top:14px;width:100%;padding:10px;font-weight:600">수동 재검토 (문제 해결용)</button>
<p style="font-size:12px;color:#666">정상 흐름에서는 추가 버튼을 누르지 않아도 실제 발행됩니다. 실패 시 아래 진단 도구를 사용하세요.</p>
<button id="confirmFinalPublish" type="button" disabled hidden>승인하고 실제 발행</button>
<pre id="finalPublishStatus" role="status" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px system-ui;max-height:220px;overflow:auto"></pre>
<details style="margin-top:14px"><summary>진단 도구 (발행 안 함)</summary>
<button id="inspectPublish" type="button" style="margin-top:8px">발행 준비 상태 확인</button>
<pre id="publishStatus" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px system-ui"></pre>
<button id="openPublishSettings" type="button" style="margin-top:8px">발행 설정 열기</button>
<button id="inspectPublishDialog" type="button" style="margin-top:8px">발행 설정 화면 확인</button>
<pre id="publishDialogStatus" style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px system-ui;max-height:240px;overflow:auto"></pre>
</details>
<script src="publish-inspect.js"></script>
<script src="publish-dialog-inspect.js"></script>
<script src="publish-dialog-open.js"></script>
<script src="publish-approval.js"></script>
</body></html>
