name: Mobile-approved Naver publishing
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Actually publish (requires configured session)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: naver-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Check or publish approved post
        env:
          NAVER_STORAGE_STATE: ${{ secrets.NAVER_STORAGE_STATE }}
          PUBLISH: ${{ inputs.publish }}
        run: node automation/publish.mjs
      - name: Commit publication receipt
        if: ${{ inputs.publish }}
        run: |
          if [ -n "$(git status --porcelain posts/published)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts/published
            git commit -m "record: Naver publication receipt"
            git push
          fi
