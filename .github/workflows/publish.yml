name: Validate approved post
on:
  workflow_dispatch:
    inputs:
      post_path:
        description: 'Path to approved post JSON'
        required: true
        default: 'posts/example.json'
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run validate -- "$POST_PATH"
        env:
          POST_PATH: ${{ inputs.post_path }}
      - run: npm run publish -- "$POST_PATH"
        env:
          POST_PATH: ${{ inputs.post_path }}
